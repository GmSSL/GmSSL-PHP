name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GMSSL_VERSION: 3.2.0

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            php-version: '8.3'
          - name: macOS ARM64
            runner: macos-14
            php-version: '8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install build tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config autoconf libtool

      - name: Install build tools on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake pkg-config autoconf automake libtool

      - name: Build GmSSL
        shell: bash
        run: |
          git clone --depth 1 --branch "v${GMSSL_VERSION}" https://github.com/guanzhi/GmSSL.git "$RUNNER_TEMP/GmSSL"
          cmake -S "$RUNNER_TEMP/GmSSL" -B "$RUNNER_TEMP/GmSSL/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/gmssl"
          cmake --build "$RUNNER_TEMP/GmSSL/build" --parallel
          cmake --install "$RUNNER_TEMP/GmSSL/build"

      - name: Build extension
        shell: bash
        run: |
          phpize
          ./configure --with-gmssl="$RUNNER_TEMP/gmssl"
          make -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Run tests
        shell: bash
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          LD_LIBRARY_PATH: ${{ runner.temp }}/gmssl/lib:${{ runner.temp }}/gmssl/lib64
          DYLD_LIBRARY_PATH: ${{ runner.temp }}/gmssl/lib:${{ runner.temp }}/gmssl/lib64
        run: make test
